[railway]
version = 2

[project]
name = "novel-platform"

[build]
builder = "nixpacks"
builderConfig = "nodejs-20"

[deploy]
numInstances = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 10
restartPolicyDelay = 5

[environment]
PORT = "3000"
NODE_ENV = "production"
