<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 小说支付中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
    }
    .admin-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 32px 40px;
      color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .admin-header h1 { font-size: 28px; font-weight: 700; margin: 0; }
    .admin-header p { color: rgba(255,255,255,0.8); font-size: 14px; margin: 0; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .header-btn {
      padding: 10px 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .header-btn:hover { background: rgba(255,255,255,0.2); }
    .shortcuts-hint {
      background: rgba(255,255,255,0.05);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      margin-top: 12px;
    }
    .shortcuts-hint kbd {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 4px;
      margin: 0 4px;
      font-family: monospace;
    }
    .admin-container { max-width: 1400px; margin: 0 auto; padding: 32px 40px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: all 0.2s;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .stat-card.active { border-color: #007aff; }
    .stat-card.alert { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.4); }
      50% { box-shadow: 0 0 0 10px rgba(255, 149, 0, 0); }
    }
    .stat-label { font-size: 13px; color: #86868b; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #1d1d1f; }
    .stat-change { font-size: 12px; margin-top: 8px; }
    .stat-change.success { color: #34c759; }
    .stat-change.warning { color: #ff9500; }
    .stat-change.danger { color: #ff3b30; }
    .toolbar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toolbar-btn {
      padding: 10px 16px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-btn:hover { background: #f5f5f7; }
    .toolbar-btn.primary { background: #007aff; color: white; border-color: #007aff; }
    .toolbar-btn.primary:hover { background: #0066d6; }
    .toolbar-btn.success { background: #34c759; color: white; border-color: #34c759; }
    .toolbar-btn.success:hover { background: #2db84d; }
    .toolbar-btn.danger { background: #ff3b30; color: white; border-color: #ff3b30; }
    .toolbar-btn.danger:hover { background: #e03127; }
    .toolbar-btn:disabled { background: #f0f0f0; color: #a0a0a0; cursor: not-allowed; }
    .search-box {
      flex: 1;
      min-width: 300px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 16px;
      padding-left: 40px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .search-box input:focus { outline: none; border-color: #007aff; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a0a0;
    }
    .filter-select {
      padding: 10px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      background: white;
      cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: #007aff; }
    .admin-panel {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      display: none;
    }
    .admin-panel.active { display: block; }
    .panel-title { font-size: 20px; font-weight: 700; color: #1d1d1f; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .order-table { width: 100%; border-collapse: collapse; }
    .order-table th {
      background: #f5f5f7;
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #86868b;
      border-radius: 8px 8px 0 0;
    }
    .order-table td {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      color: #1d1d1f;
    }
    .order-table tr { transition: all 0.2s; }
    .order-table tr:hover { background: #fafafa; }
    .order-table tr.selected { background: #e3f2fd; }
    .order-table tr.risk-high { background: #ffebee; }
    .order-table tr.risk-medium { background: #fff8e1; }
    .checkbox-cell { width: 40px; }
    .checkbox-cell input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #007aff;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-pending { background: #fff3e0; color: #ff9800; }
    .status-paid { background: #e8f5e9; color: #4caf50; }
    .status-rejected { background: #ffebee; color: #f44336; }
    .status-expired { background: #f5f5f5; color: #9e9e9e; }
    .risk-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .risk-low { background: #e8f5e9; color: #4caf50; }
    .risk-medium { background: #fff3e0; color: #ff9800; }
    .risk-high { background: #ffebee; color: #f44336; }
    .action-group { display: flex; gap: 8px; }
    .action-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn.approve { background: #34c759; color: white; }
    .action-btn.approve:hover { background: #2db84d; transform: scale(1.05); }
    .action-btn.reject { background: #ff3b30; color: white; }
    .action-btn.reject:hover { background: #e03127; transform: scale(1.05); }
    .action-btn:disabled { background: #c7c7cc; cursor: not-allowed; transform: none; }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
      max-width: 400px;
    }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notification.show { display: flex; }
    .notification.success { border-left: 4px solid #34c759; }
    .notification.error { border-left: 4px solid #ff3b30; }
    .notification.warning { border-left: 4px solid #ff9500; }
    .notif-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .notification.success .notif-icon { background: #34c759; color: white; }
    .notification.error .notif-icon { background: #ff3b30; color: white; }
    .notification.warning .notif-icon { background: #ff9500; color: white; }
    .notif-content { flex: 1; }
    .notif-title { font-size: 14px; font-weight: 600; color: #1d1d1f; }
    .notif-message { font-size: 13px; color: #86868b; margin-top: 2px; }
    .batch-info {
      background: #e3f2fd;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
    }
    .batch-info.show { display: flex; }
    .batch-info-text { font-size: 14px; color: #1976d2; font-weight: 600; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #86868b;
    }
    .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
    .quick-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }
    .quick-stat {
      flex: 1;
      padding: 16px;
      background: #f5f5f7;
      border-radius: 12px;
      text-align: center;
    }
    .quick-stat-value { font-size: 24px; font-weight: 700; color: #1d1d1f; }
    .quick-stat-label { font-size: 12px; color: #86868b; margin-top: 4px; }
    .audit-history {
      margin-top: 24px;
    }
    .audit-item {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-left: 3px solid #e0e0e0;
      margin-left: 12px;
      position: relative;
    }
    .audit-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 20px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e0e0e0;
    }
    .audit-item.approved { border-color: #34c759; }
    .audit-item.approved::before { background: #34c759; }
    .audit-item.rejected { border-color: #ff3b30; }
    .audit-item.rejected::before { background: #ff3b30; }
    .audit-time { font-size: 12px; color: #86868b; width: 150px; flex-shrink: 0; }
    .audit-content { flex: 1; font-size: 14px; }
    @media (max-width: 768px) {
      .admin-header { padding: 20px; }
      .header-top { flex-direction: column; gap: 12px; }
      .admin-container { padding: 20px; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .toolbar { flex-direction: column; }
      .toolbar-group { width: 100%; }
      .search-box { min-width: 100%; }
      .order-table { font-size: 12px; }
      .order-table th, .order-table td { padding: 10px 8px; }
      .shortcuts-hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <div class="notif-icon">✓</div>
    <div class="notif-content">
      <div class="notif-title" id="notif-title">成功</div>
      <div class="notif-message" id="notif-message">操作已完成</div>
    </div>
  </div>

  <div class="admin-header">
    <div class="header-top">
      <div>
        <h1>📊 小说支付中心 - 管理后台</h1>
        <p>订单管理 · 用户管理 · 数据统计</p>
      </div>
      <div class="header-actions">
        <a href="/" class="header-btn" target="_blank">🏠 返回首页</a>
      </div>
    </div>
    <div class="shortcuts-hint">
      快捷键：<kbd>A</kbd> 通过选中 <kbd>D</kbd> 拒绝选中 <kbd>R</kbd> 刷新 <kbd>F</kbd> 搜索
    </div>
  </div>

  <div class="admin-container">
    <div class="stats-grid">
      <div class="stat-card alert" id="pending-card" onclick="switchTab('orders')">
        <div class="stat-label">待审核订单</div>
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-change danger">⚡ 需要处理</div>
      </div>
      <div class="stat-card" onclick="switchTab('all-orders')">
        <div class="stat-label">已完成订单</div>
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-change success">✓ 今日完成</div>
      </div>
      <div class="stat-card" onclick="switchTab('users')">
        <div class="stat-label">注册用户</div>
        <div class="stat-value" id="stat-users">0</div>
        <div class="stat-change success">📈 持续增长</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总收入</div>
        <div class="stat-value" id="stat-revenue">¥0</div>
        <div class="stat-change success">💰 累计收入</div>
      </div>
    </div>

    <div id="orders-panel" class="admin-panel active">
      <h2 class="panel-title">
        <span>📋 待审核订单</span>
        <span style="font-size:14px;font-weight:normal;color:#86868b;" id="orders-subtitle">共 0 个待处理</span>
      </h2>
      
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="搜索订单号、用户邮箱..." oninput="filterOrders()">
        </div>
        <select class="filter-select" id="risk-filter" onchange="filterOrders()">
          <option value="">全部风险</option>
          <option value="high">🔴 高风险</option>
          <option value="medium">🟡 中风险</option>
          <option value="low">🟢 低风险</option>
        </select>
        <select class="filter-select" id="type-filter" onchange="filterOrders()">
          <option value="">全部类型</option>
          <option value="coin">书币充值</option>
          <option value="member">会员开通</option>
        </select>
        <div class="toolbar-group">
          <button class="toolbar-btn" onclick="loadOrders()">🔄 刷新</button>
        </div>
      </div>

      <div class="batch-info" id="batch-info">
        <span class="batch-info-text" id="batch-count">已选择 0 个订单</span>
        <div class="toolbar-group">
          <button class="toolbar-btn success" onclick="batchApprove()">✅ 批量通过</button>
          <button class="toolbar-btn danger" onclick="batchReject()">❌ 批量拒绝</button>
          <button class="toolbar-btn" onclick="clearSelection()">✕ 取消选择</button>
        </div>
      </div>

      <div id="pending-orders">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>暂无待审核订单</p>
        </div>
      </div>
    </div>

    <div id="all-orders-panel" class="admin-panel">
      <h2 class="panel-title">📦 全部订单记录</h2>
      <div class="toolbar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="all-search-input" placeholder="搜索订单...">
        </div>
        <button class="toolbar-btn" onclick="loadAllOrders()">🔄 刷新</button>
      </div>
      <div id="all-orders">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>暂无订单记录</p>
        </div>
      </div>
    </div>

    <div id="users-panel" class="admin-panel">
      <h2 class="panel-title">👥 注册用户列表</h2>
      <div class="toolbar">
        <button class="toolbar-btn" onclick="loadUsers()">🔄 刷新用户</button>
      </div>
      <div id="user-list">
        <div class="empty-state">
          <div class="empty-state-icon">👥</div>
          <p>暂无注册用户</p>
        </div>
      </div>
    </div>

    <div id="history-panel" class="admin-panel">
      <h2 class="panel-title">📜 审核历史记录</h2>
      <div class="audit-history" id="audit-history">
        <div class="empty-state">
          <div class="empty-state-icon">📝</div>
          <p>暂无审核记录</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allOrders = [];
    let selectedOrders = new Set();
    let auditHistory = [];

    function showNotification(type, title, message) {
      const notif = document.getElementById('notification');
      const notifTitle = document.getElementById('notif-title');
      const notifMsg = document.getElementById('notif-message');
      const notifIcon = notif.querySelector('.notif-icon');
      
      notif.className = 'notification ' + type;
      notifTitle.textContent = title;
      notifMsg.textContent = message;
      
      if (type === 'success') notifIcon.textContent = '✓';
      else if (type === 'error') notifIcon.textContent = '✕';
      else notifIcon.textContent = '⚠';
      
      notif.classList.add('show');
      setTimeout(() => notif.classList.remove('show'), 4000);
    }

    function switchTab(tab) {
      document.querySelectorAll('.admin-tab, .admin-panel').forEach(el => {
        if (el.classList.contains('admin-tab') || el.classList.contains('admin-panel')) {
          el.classList.remove('active');
        }
      });
      
      const tabMap = {
        'orders': ['orders-panel', 'stat-pending'],
        'all-orders': ['all-orders-panel'],
        'users': ['users-panel'],
        'history': ['history-panel']
      };
      
      if (tabMap[tab]) {
        tabMap[tab].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.add('active');
        });
      }
      
      if (tab === 'all-orders') loadAllOrders();
      else if (tab === 'users') loadUsers();
      else if (tab === 'history') renderAuditHistory();
      else if (tab === 'orders') {
        document.getElementById('pending-card').classList.add('active');
      }
    }

    function calculateRisk(order) {
      const amount = parseFloat(order.totalAmount || order.price || 0);
      const now = Date.now();
      const orderTime = order.createdAt ? new Date(order.createdAt).getTime() : now;
      const hoursOld = (now - orderTime) / (1000 * 60 * 60);
      
      if (amount > 100) return 'high';
      if (amount > 50 || hoursOld < 0.5) return 'medium';
      return 'low';
    }

    async function loadOrders() {
      try {
        const response = await fetch('/api/alipay/orders');
        const result = await response.json();
        
        if (result.success) {
          allOrders = result.orders.filter(o => o.status === 'pending' || o.status === 'pending_review');
          renderPendingOrders(allOrders);
          updateStats(result.orders);
          
          const pendingCard = document.getElementById('pending-card');
          if (allOrders.length > 0) {
            pendingCard.classList.add('alert');
          } else {
            pendingCard.classList.remove('alert');
          }
        }
      } catch (error) {
        showNotification('error', '加载失败', '无法加载订单数据');
      }
    }

    async function loadAllOrders() {
      try {
        const response = await fetch('/api/alipay/orders');
        const result = await response.json();
        
        if (result.success) {
          renderAllOrders(result.orders);
        }
      } catch (error) {
        showNotification('error', '加载失败', '无法加载订单数据');
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/auth/users');
        const result = await response.json();
        
        if (result.success) {
          renderUsers(result.users);
        }
      } catch (error) {
        showNotification('error', '加载失败', '无法加载用户数据');
      }
    }

    function filterOrders() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const risk = document.getElementById('risk-filter').value;
      const type = document.getElementById('type-filter').value;
      
      let filtered = allOrders.filter(order => {
        const matchSearch = !search || 
          (order.orderNo || order.outTradeNo || '').toLowerCase().includes(search) ||
          (order.userEmail || order.userId || '').toLowerCase().includes(search);
        
        const matchRisk = !risk || calculateRisk(order) === risk;
        const matchType = !type || order.type === type;
        
        return matchSearch && matchRisk && matchType;
      });
      
      renderPendingOrders(filtered);
    }

    function renderPendingOrders(orders) {
      const container = document.getElementById('pending-orders');
      document.getElementById('orders-subtitle').textContent = `共 ${orders.length} 个待处理`;
      
      if (!orders.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无待审核订单</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="order-table">
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="select-all" onchange="toggleSelectAll()"></th>
              <th>订单号</th>
              <th>用户邮箱</th>
              <th>订单类型</th>
              <th>金额</th>
              <th>风险等级</th>
              <th>状态</th>
              <th>时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      orders.forEach(order => {
        const risk = calculateRisk(order);
        const riskClass = 'risk-' + risk;
        const riskText = risk === 'high' ? '🔴 高' : risk === 'medium' ? '🟡 中' : '🟢 低';
        const statusClass = order.status === 'pending_review' ? 'status-pending' : 'status-expired';
        const statusText = order.status === 'pending_review' ? '待审核' : '待支付';
        const typeText = order.type === 'coin' ? '书币充值' : '会员开通';
        const time = order.createdAt ? new Date(order.createdAt).toLocaleString() : '-';
        const orderNo = order.orderNo || order.outTradeNo || '';
        const isSelected = selectedOrders.has(orderNo);
        
        html += `
          <tr class="${riskClass} ${isSelected ? 'selected' : ''}" data-order="${orderNo}">
            <td class="checkbox-cell">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${orderNo}')">
            </td>
            <td style="font-family:monospace;font-size:13px;">${orderNo}</td>
            <td>${order.userEmail || order.userId || '-'}</td>
            <td>${typeText}</td>
            <td style="font-weight:700;color:#1d1d1f;">¥${order.totalAmount || order.price}</td>
            <td><span class="risk-badge ${riskClass}">${riskText}</span></td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td style="font-size:12px;color:#86868b;">${time}</td>
            <td>
              <div class="action-group">
                <button class="action-btn approve" onclick="approveOrder('${orderNo}')">通过</button>
                <button class="action-btn reject" onclick="rejectOrder('${orderNo}')">拒绝</button>
              </div>
            </td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderAllOrders(orders) {
      const container = document.getElementById('all-orders');
      
      if (!orders.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无订单记录</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="order-table">
          <thead>
            <tr>
              <th>订单号</th>
              <th>用户邮箱</th>
              <th>订单类型</th>
              <th>金额</th>
              <th>状态</th>
              <th>时间</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      orders.forEach(order => {
        let statusClass, statusText;
        if (order.status === 'paid') { statusClass = 'status-paid'; statusText = '已完成'; }
        else if (order.status === 'rejected') { statusClass = 'status-rejected'; statusText = '已拒绝'; }
        else if (order.status === 'expired') { statusClass = 'status-expired'; statusText = '已过期'; }
        else { statusClass = 'status-pending'; statusText = '待审核'; }
        
        const typeText = order.type === 'coin' ? '书币充值' : '会员开通';
        const time = order.createdAt ? new Date(order.createdAt).toLocaleString() : '-';
        
        html += `
          <tr>
            <td style="font-family:monospace;font-size:13px;">${order.orderNo || order.outTradeNo}</td>
            <td>${order.userEmail || order.userId || '-'}</td>
            <td>${typeText}</td>
            <td style="font-weight:700;">¥${order.totalAmount || order.price}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td style="font-size:12px;color:#86868b;">${time}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderUsers(users) {
      const container = document.getElementById('user-list');
      const userArray = Object.values(users);
      
      if (!userArray.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">👥</div>
            <p>暂无注册用户</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="order-table">
          <thead>
            <tr>
              <th>用户邮箱</th>
              <th>用户ID</th>
              <th>书币余额</th>
              <th>累计充值</th>
              <th>会员状态</th>
              <th>注册时间</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      userArray.forEach(user => {
        const isVip = user.vipExpireTime && new Date(user.vipExpireTime) > new Date();
        const vipStatus = isVip ? `<span class="status-badge status-paid">VIP</span>` : `<span class="status-badge status-expired">普通</span>`;
        const regTime = user.createdAt ? new Date(user.createdAt).toLocaleString() : '-';
        
        html += `
          <tr>
            <td style="font-weight:600;">${user.email}</td>
            <td style="font-family:monospace;font-size:12px;">${user.userId}</td>
            <td>${user.coins || 0}</td>
            <td>¥${user.totalRecharged || 0}</td>
            <td>${vipStatus}</td>
            <td style="font-size:12px;color:#86868b;">${regTime}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function updateStats(orders) {
      const pending = orders.filter(o => o.status === 'pending' || o.status === 'pending_review').length;
      const completed = orders.filter(o => o.status === 'paid').length;
      const totalRevenue = orders.filter(o => o.status === 'paid').reduce((sum, o) => sum + parseFloat(o.totalAmount || o.price || 0), 0);
      
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-revenue').textContent = '¥' + totalRevenue.toFixed(2);
    }

    function toggleSelect(orderNo) {
      if (selectedOrders.has(orderNo)) {
        selectedOrders.delete(orderNo);
      } else {
        selectedOrders.add(orderNo);
      }
      updateBatchInfo();
      renderPendingOrders(allOrders);
    }

    function toggleSelectAll() {
      const selectAll = document.getElementById('select-all').checked;
      if (selectAll) {
        allOrders.forEach(order => selectedOrders.add(order.orderNo || order.outTradeNo));
      } else {
        selectedOrders.clear();
      }
      updateBatchInfo();
      renderPendingOrders(allOrders);
    }

    function clearSelection() {
      selectedOrders.clear();
      updateBatchInfo();
      renderPendingOrders(allOrders);
    }

    function updateBatchInfo() {
      const batchInfo = document.getElementById('batch-info');
      const batchCount = document.getElementById('batch-count');
      
      if (selectedOrders.size > 0) {
        batchInfo.classList.add('show');
        batchCount.textContent = `已选择 ${selectedOrders.size} 个订单`;
      } else {
        batchInfo.classList.remove('show');
      }
    }

    async function batchApprove() {
      if (selectedOrders.size === 0) return;
      if (!confirm(`确认通过选中的 ${selectedOrders.size} 个订单？`)) return;
      
      let success = 0, failed = 0;
      for (const orderNo of selectedOrders) {
        try {
          const response = await fetch(`/api/alipay/orders/${orderNo}/approve`, { method: 'POST' });
          const result = await response.json();
          if (result.success) {
            success++;
            addAuditRecord(orderNo, 'approved');
          } else {
            failed++;
          }
        } catch (e) {
          failed++;
        }
      }
      
      selectedOrders.clear();
      updateBatchInfo();
      loadOrders();
      
      if (failed === 0) {
        showNotification('success', '批量通过成功', `成功通过 ${success} 个订单`);
      } else {
        showNotification('warning', '部分失败', `成功 ${success} 个，失败 ${failed} 个`);
      }
    }

    async function batchReject() {
      if (selectedOrders.size === 0) return;
      if (!confirm(`确认拒绝选中的 ${selectedOrders.size} 个订单？`)) return;
      
      let success = 0, failed = 0;
      for (const orderNo of selectedOrders) {
        try {
          const response = await fetch(`/api/alipay/orders/${orderNo}/reject`, { method: 'POST' });
          const result = await response.json();
          if (result.success) {
            success++;
            addAuditRecord(orderNo, 'rejected');
          } else {
            failed++;
          }
        } catch (e) {
          failed++;
        }
      }
      
      selectedOrders.clear();
      updateBatchInfo();
      loadOrders();
      
      if (failed === 0) {
        showNotification('success', '批量拒绝成功', `成功拒绝 ${success} 个订单`);
      } else {
        showNotification('warning', '部分失败', `成功 ${success} 个，失败 ${failed} 个`);
      }
    }

    function addAuditRecord(orderNo, action) {
      auditHistory.unshift({
        orderNo,
        action,
        time: new Date().toLocaleString()
      });
      if (auditHistory.length > 50) auditHistory.pop();
    }

    function renderAuditHistory() {
      const container = document.getElementById('audit-history');
      
      if (!auditHistory.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p>暂无审核记录</p>
          </div>
        `;
        return;
      }
      
      let html = '';
      auditHistory.forEach(record => {
        const actionClass = record.action === 'approved' ? 'approved' : 'rejected';
        const actionText = record.action === 'approved' ? '✅ 通过' : '❌ 拒绝';
        
        html += `
          <div class="audit-item ${actionClass}">
            <div class="audit-time">${record.time}</div>
            <div class="audit-content">
              ${actionText} 订单 <strong style="font-family:monospace;">${record.orderNo}</strong>
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    async function approveOrder(orderNo) {
      if (!confirm('确认通过此订单？用户将获得相应权益。')) return;
      
      try {
        const response = await fetch(`/api/alipay/orders/${orderNo}/approve`, { method: 'POST' });
        const result = await response.json();
        
        if (result.success) {
          showNotification('success', '审核通过', '订单已通过，用户权益已发放');
          addAuditRecord(orderNo, 'approved');
          loadOrders();
        } else {
          showNotification('error', '操作失败', result.message);
        }
      } catch (error) {
        showNotification('error', '操作失败', '网络错误');
      }
    }

    async function rejectOrder(orderNo) {
      if (!confirm('确认拒绝此订单？')) return;
      
      try {
        const response = await fetch(`/api/alipay/orders/${orderNo}/reject`, { method: 'POST' });
        const result = await response.json();
        
        if (result.success) {
          showNotification('success', '已拒绝', '订单已被拒绝');
          addAuditRecord(orderNo, 'rejected');
          loadOrders();
        } else {
          showNotification('error', '操作失败', result.message);
        }
      } catch (error) {
        showNotification('error', '操作失败', '网络错误');
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      
      const key = e.key.toLowerCase();
      if (key === 'a') batchApprove();
      else if (key === 'd') batchReject();
      else if (key === 'r') loadOrders();
      else if (key === 'f') {
        e.preventDefault();
        document.getElementById('search-input').focus();
      }
    });

    loadOrders();
  </script>
</body>
</html>
