<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 小说支付中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 1.5rem;
      color: #1d1d1f;
    }
    .back-btn {
      padding: 10px 20px;
      background: #f5f5f7;
      color: #1d1d1f;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .back-btn:hover { background: #e5e5ea; }
    
    .admin-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }
    
    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .admin-tab {
      padding: 12px 20px;
      background: #f5f5f7;
      border: none;
      border-radius: 10px;
      color: #86868b;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-tab:hover { color: #1d1d1f; }
    .admin-tab.active {
      background: #007aff;
      color: white;
    }
    
    .section-title {
      font-size: 1.2rem;
      color: #1d1d1f;
      margin-bottom: 16px;
      font-weight: 600;
    }
    
    .order-item {
      background: #fafafa;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      border: 1px solid #e5e5e5;
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .order-no {
      font-weight: 600;
      color: #1d1d1f;
    }
    .order-status {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-paid { background: #d4edda; color: #155724; }
    .status-expired { background: #f8d7da; color: #721c24; }
    
    .order-details {
      font-size: 0.9rem;
      color: #86868b;
      line-height: 1.8;
    }
    .order-actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .approve-btn { background: #34c759; color: white; }
    .approve-btn:hover { background: #28a745; }
    .reject-btn { background: #ff3b30; color: white; }
    .reject-btn:hover { background: #e03127; }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #86868b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ 管理后台</h1>
      <button class="back-btn" onclick="window.location.href='/payment.html'">返回前台</button>
    </div>

    <div class="admin-card">
      <div class="admin-tabs">
        <button class="admin-tab active" onclick="switchAdminTab('orders')">📋 待审核订单</button>
        <button class="admin-tab" onclick="switchAdminTab('allOrders')">📊 全部订单</button>
        <button class="admin-tab" onclick="switchAdminTab('users')">👥 用户管理</button>
      </div>
      
      <div id="orders-section" class="admin-section">
        <h2 class="section-title">待审核订单</h2>
        <div id="pending-orders-container"></div>
      </div>
      
      <div id="allOrders-section" class="admin-section" style="display:none;">
        <h2 class="section-title">全部订单</h2>
        <div id="all-orders-container"></div>
      </div>
      
      <div id="users-section" class="admin-section" style="display:none;">
        <h2 class="section-title">用户列表</h2>
        <div id="users-container"></div>
      </div>
    </div>
  </div>

  <script>
    let pendingOrders = JSON.parse(localStorage.getItem('pendingOrders') || '[]');
    let allOrders = JSON.parse(localStorage.getItem('allOrders') || '[]');
    let users = JSON.parse(localStorage.getItem('users') || '{}');
    
    function switchAdminTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.admin-section').forEach(el => el.style.display = 'none');
      
      if (tab === 'orders') {
        document.querySelector('.admin-tab:nth-child(1)').classList.add('active');
        document.getElementById('orders-section').style.display = 'block';
        loadPendingOrders();
      } else if (tab === 'allOrders') {
        document.querySelector('.admin-tab:nth-child(2)').classList.add('active');
        document.getElementById('allOrders-section').style.display = 'block';
        loadAllOrders();
      } else if (tab === 'users') {
        document.querySelector('.admin-tab:nth-child(3)').classList.add('active');
        document.getElementById('users-section').style.display = 'block';
        loadUsers();
      }
    }
    
    function loadPendingOrders() {
      const container = document.getElementById('pending-orders-container');
      const pending = allOrders.filter(o => o.status === 'pending_review');
      
      if (!pending.length) {
        container.innerHTML = '<div class="empty-state">🎉 暂无待审核订单</div>';
        return;
      }
      
      container.innerHTML = pending.map(order => `
        <div class="order-item">
          <div class="order-header">
            <span class="order-no">订单号: ${order.orderNo}</span>
            <span class="order-status status-pending">待审核</span>
          </div>
          <div class="order-details">
            <div>用户: ${order.userEmail || '未登录'}</div>
            <div>类型: ${order.type === 'coin' ? '书币充值' : '会员开通'}</div>
            <div>金额: ¥${order.price}</div>
            <div>详情: ${order.type === 'coin' ? order.coins + '书币' + (order.gift ? ' +' + order.gift + '赠送' : '') : order.name}</div>
            ${order.transactionId ? `<div>交易号: ${order.transactionId}</div>` : ''}
            <div>提交时间: ${new Date(order.submittedAt || order.createdAt).toLocaleString()}</div>
          </div>
          <div class="order-actions">
            <button class="action-btn approve-btn" onclick="approveOrder('${order.orderNo}')">✅ 审核通过</button>
            <button class="action-btn reject-btn" onclick="rejectOrder('${order.orderNo}')">❌ 审核拒绝</button>
          </div>
        </div>
      `).join('');
    }
    
    function loadAllOrders() {
      const container = document.getElementById('all-orders-container');
      
      if (!allOrders.length) {
        container.innerHTML = '<div class="empty-state">暂无订单记录</div>';
        return;
      }
      
      container.innerHTML = allOrders.map(order => `
        <div class="order-item">
          <div class="order-header">
            <span class="order-no">订单号: ${order.orderNo}</span>
            <span class="order-status ${order.status === 'paid' ? 'status-paid' : order.status === 'expired' ? 'status-expired' : 'status-pending'}">
              ${order.status === 'paid' ? '已完成' : order.status === 'expired' ? '已过期' : order.status === 'pending_review' ? '待审核' : '待支付'}
            </span>
          </div>
          <div class="order-details">
            <div>用户: ${order.userEmail || '未登录'}</div>
            <div>类型: ${order.type === 'coin' ? '书币充值' : '会员开通'}</div>
            <div>金额: ¥${order.price}</div>
            <div>创建时间: ${new Date(order.createdAt).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }
    
    function loadUsers() {
      const container = document.getElementById('users-container');
      const userList = Object.values(users);
      
      if (!userList.length) {
        container.innerHTML = '<div class="empty-state">暂无用户</div>';
        return;
      }
      
      container.innerHTML = userList.map(user => `
        <div class="order-item">
          <div class="order-header">
            <span class="order-no">${user.email}</span>
          </div>
          <div class="order-details">
            <div>书币余额: ${user.coins || 0}</div>
            <div>累计充值: ¥${user.totalRecharged || 0}</div>
            <div>会员状态: ${user.vipExpireTime && new Date(user.vipExpireTime) > new Date() ? '会员有效期至 ' + new Date(user.vipExpireTime).toLocaleDateString() : '非会员'}</div>
            <div>注册时间: ${new Date(user.createdAt).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }
    
    function approveOrder(orderNo) {
      const orderIndex = allOrders.findIndex(o => o.orderNo === orderNo);
      if (orderIndex === -1) return;
      
      allOrders[orderIndex].status = 'paid';
      allOrders[orderIndex].approvedAt = new Date().toISOString();
      
      const userEmail = allOrders[orderIndex].userEmail;
      if (userEmail && users[userEmail]) {
        const user = users[userEmail];
        
        if (allOrders[orderIndex].type === 'coin') {
          user.coins = (user.coins || 0) + allOrders[orderIndex].coins;
          if (allOrders[orderIndex].gift) {
            user.coins += allOrders[orderIndex].gift;
          }
          user.totalRecharged = (user.totalRecharged || 0) + allOrders[orderIndex].price;
        } else {
          const now = new Date();
          const currentExpire = user.vipExpireTime ? new Date(user.vipExpireTime) : now;
          if (currentExpire < now) currentExpire.setTime(now.getTime());
          currentExpire.setDate(currentExpire.getDate() + (allOrders[orderIndex].days || 30));
          user.vipExpireTime = currentExpire.toISOString();
          user.totalRecharged = (user.totalRecharged || 0) + allOrders[orderIndex].price;
          if (allOrders[orderIndex].coins) {
            user.coins = (user.coins || 0) + allOrders[orderIndex].coins;
          }
        }
        
        localStorage.setItem('users', JSON.stringify(users));
      }
      
      localStorage.setItem('allOrders', JSON.stringify(allOrders));
      loadPendingOrders();
      loadAllOrders();
      
      alert('✅ 订单审核通过！用户已收到充值/会员权益');
    }
    
    function rejectOrder(orderNo) {
      const orderIndex = allOrders.findIndex(o => o.orderNo === orderNo);
      if (orderIndex === -1) return;
      
      allOrders[orderIndex].status = 'rejected';
      allOrders[orderIndex].rejectedAt = new Date().toISOString();
      
      localStorage.setItem('allOrders', JSON.stringify(allOrders));
      loadPendingOrders();
      loadAllOrders();
      
      alert('❌ 订单已拒绝');
    }
    
    // 页面加载
    loadPendingOrders();
    
    // 模拟从后台同步订单数据
    fetch('/api/alipay/orders')
      .then(res => res.json())
      .then(data => {
        if (data.orders) {
          allOrders = data.orders;
          localStorage.setItem('allOrders', JSON.stringify(allOrders));
          loadPendingOrders();
          loadAllOrders();
        }
      })
      .catch(err => console.log('使用本地订单数据'));
    
    fetch('/api/auth/users')
      .then(res => res.json())
      .then(data => {
        if (data.users) {
          users = data.users;
          localStorage.setItem('users', JSON.stringify(users));
          loadUsers();
        }
      })
      .catch(err => console.log('使用本地用户数据'));
  </script>
</body>
</html>
