<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 小说支付中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
    }
    .admin-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 32px 40px;
      color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .admin-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .admin-header p { color: rgba(255,255,255,0.8); font-size: 14px; }
    .admin-container { max-width: 1400px; margin: 0 auto; padding: 32px 40px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .stat-label { font-size: 13px; color: #86868b; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #1d1d1f; }
    .stat-change { font-size: 12px; margin-top: 8px; }
    .stat-change.success { color: #34c759; }
    .stat-change.warning { color: #ff9500; }
    .admin-tabs {
      display: flex;
      gap: 8px;
      background: white;
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .admin-tab {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #86868b;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-tab:hover { color: #1d1d1f; background: #f5f5f7; }
    .admin-tab.active { background: #007aff; color: white; }
    .admin-panel {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      display: none;
    }
    .admin-panel.active { display: block; }
    .panel-title { font-size: 20px; font-weight: 700; color: #1d1d1f; margin-bottom: 24px; }
    .order-table { width: 100%; border-collapse: collapse; }
    .order-table th {
      background: #f5f5f7;
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #86868b;
      border-radius: 8px 8px 0 0;
    }
    .order-table td {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      color: #1d1d1f;
    }
    .order-table tr:hover { background: #fafafa; }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-pending { background: #fff3e0; color: #ff9800; }
    .status-paid { background: #e8f5e9; color: #4caf50; }
    .status-rejected { background: #ffebee; color: #f44336; }
    .status-expired { background: #f5f5f5; color: #9e9e9e; }
    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-right: 8px;
    }
    .action-btn.approve { background: #34c759; color: white; }
    .action-btn.approve:hover { background: #2db84d; }
    .action-btn.reject { background: #ff3b30; color: white; }
    .action-btn.reject:hover { background: #e03127; }
    .action-btn:disabled { background: #c7c7cc; cursor: not-allowed; }
    .refresh-btn {
      padding: 10px 20px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }
    .refresh-btn:hover { background: #0066d6; }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #86868b;
    }
    .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .notification.show { display: flex; }
    .notification.success { border-left: 4px solid #34c759; }
    .notification.error { border-left: 4px solid #ff3b30; }
    .notif-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }
    .notification.success .notif-icon { background: #34c759; color: white; }
    .notification.error .notif-icon { background: #ff3b30; color: white; }
    .notif-content { flex: 1; }
    .notif-title { font-size: 14px; font-weight: 600; color: #1d1d1f; }
    .notif-message { font-size: 13px; color: #86868b; margin-top: 2px; }
    @media (max-width: 768px) {
      .admin-header { padding: 20px; }
      .admin-container { padding: 20px; }
      .stats-grid { grid-template-columns: 1fr; }
      .admin-tabs { flex-direction: column; }
      .order-table { font-size: 12px; }
      .order-table th, .order-table td { padding: 10px 8px; }
    }
  </style>
</head>
<body>
  <div class="notification" id="notification">
    <div class="notif-icon">✓</div>
    <div class="notif-content">
      <div class="notif-title" id="notif-title">成功</div>
      <div class="notif-message" id="notif-message">操作已完成</div>
    </div>
  </div>

  <div class="admin-header">
    <h1>📊 小说支付中心 - 管理后台</h1>
    <p>订单管理 · 用户管理 · 数据统计</p>
  </div>

  <div class="admin-container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">待审核订单</div>
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-change warning">⚡ 需要处理</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">已完成订单</div>
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-change success">✓ 今日完成</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">注册用户</div>
        <div class="stat-value" id="stat-users">0</div>
        <div class="stat-change success">📈 持续增长</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总收入</div>
        <div class="stat-value" id="stat-revenue">¥0</div>
        <div class="stat-change success">💰 累计收入</div>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('orders')">📋 待审核订单</button>
      <button class="admin-tab" onclick="switchTab('all-orders')">📦 全部订单</button>
      <button class="admin-tab" onclick="switchTab('users')">👥 用户管理</button>
    </div>

    <div id="orders-panel" class="admin-panel active">
      <h2 class="panel-title">待审核订单</h2>
      <button class="refresh-btn" onclick="loadOrders()">🔄 刷新订单</button>
      <div id="pending-orders">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>暂无待审核订单</p>
        </div>
      </div>
    </div>

    <div id="all-orders-panel" class="admin-panel">
      <h2 class="panel-title">全部订单记录</h2>
      <button class="refresh-btn" onclick="loadAllOrders()">🔄 刷新订单</button>
      <div id="all-orders">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>暂无订单记录</p>
        </div>
      </div>
    </div>

    <div id="users-panel" class="admin-panel">
      <h2 class="panel-title">注册用户列表</h2>
      <button class="refresh-btn" onclick="loadUsers()">🔄 刷新用户</button>
      <div id="user-list">
        <div class="empty-state">
          <div class="empty-state-icon">👥</div>
          <p>暂无注册用户</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function showNotification(type, title, message) {
      const notif = document.getElementById('notification');
      const notifTitle = document.getElementById('notif-title');
      const notifMsg = document.getElementById('notif-message');
      const notifIcon = notif.querySelector('.notif-icon');
      
      notif.className = 'notification ' + type;
      notifTitle.textContent = title;
      notifMsg.textContent = message;
      
      if (type === 'success') notifIcon.textContent = '✓';
      else notifIcon.textContent = '✕';
      
      notif.classList.add('show');
      setTimeout(() => notif.classList.remove('show'), 3000);
    }

    function switchTab(tab) {
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
      
      if (tab === 'orders') {
        document.querySelector('.admin-tab:nth-child(1)').classList.add('active');
        document.getElementById('orders-panel').classList.add('active');
      } else if (tab === 'all-orders') {
        document.querySelector('.admin-tab:nth-child(2)').classList.add('active');
        document.getElementById('all-orders-panel').classList.add('active');
        loadAllOrders();
      } else if (tab === 'users') {
        document.querySelector('.admin-tab:nth-child(3)').classList.add('active');
        document.getElementById('users-panel').classList.add('active');
        loadUsers();
      }
    }

    async function loadOrders() {
      try {
        const response = await fetch('/api/alipay/orders');
        const result = await response.json();
        
        if (result.success) {
          const pendingOrders = result.orders.filter(o => o.status === 'pending' || o.status === 'pending_review');
          renderPendingOrders(pendingOrders);
          updateStats(result.orders);
        }
      } catch (error) {
        showNotification('error', '加载失败', '无法加载订单数据');
      }
    }

    async function loadAllOrders() {
      try {
        const response = await fetch('/api/alipay/orders');
        const result = await response.json();
        
        if (result.success) {
          renderAllOrders(result.orders);
        }
      } catch (error) {
        showNotification('error', '加载失败', '无法加载订单数据');
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch('/api/auth/users');
        const result = await response.json();
        
        if (result.success) {
          renderUsers(result.users);
        }
      } catch (error) {
        showNotification('error', '加载失败', '无法加载用户数据');
      }
    }

    function renderPendingOrders(orders) {
      const container = document.getElementById('pending-orders');
      
      if (!orders.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无待审核订单</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="order-table">
          <thead>
            <tr>
              <th>订单号</th>
              <th>用户邮箱</th>
              <th>订单类型</th>
              <th>金额</th>
              <th>状态</th>
              <th>时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      orders.forEach(order => {
        const statusClass = order.status === 'pending_review' ? 'status-pending' : 'status-expired';
        const statusText = order.status === 'pending_review' ? '待审核' : '待支付';
        const typeText = order.type === 'coin' ? '书币充值' : '会员开通';
        const time = order.createdAt ? new Date(order.createdAt).toLocaleString() : '-';
        
        html += `
          <tr>
            <td style="font-family:monospace;">${order.orderNo || order.outTradeNo}</td>
            <td>${order.userEmail || order.userId || '-'}</td>
            <td>${typeText}</td>
            <td>¥${order.totalAmount || order.price}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td style="font-size:12px;color:#86868b;">${time}</td>
            <td>
              <button class="action-btn approve" onclick="approveOrder('${order.orderNo || order.outTradeNo}')">通过</button>
              <button class="action-btn reject" onclick="rejectOrder('${order.orderNo || order.outTradeNo}')">拒绝</button>
            </td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderAllOrders(orders) {
      const container = document.getElementById('all-orders');
      
      if (!orders.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>暂无订单记录</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="order-table">
          <thead>
            <tr>
              <th>订单号</th>
              <th>用户邮箱</th>
              <th>订单类型</th>
              <th>金额</th>
              <th>状态</th>
              <th>时间</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      orders.forEach(order => {
        let statusClass, statusText;
        if (order.status === 'paid') { statusClass = 'status-paid'; statusText = '已完成'; }
        else if (order.status === 'rejected') { statusClass = 'status-rejected'; statusText = '已拒绝'; }
        else if (order.status === 'expired') { statusClass = 'status-expired'; statusText = '已过期'; }
        else { statusClass = 'status-pending'; statusText = '待审核'; }
        
        const typeText = order.type === 'coin' ? '书币充值' : '会员开通';
        const time = order.createdAt ? new Date(order.createdAt).toLocaleString() : '-';
        
        html += `
          <tr>
            <td style="font-family:monospace;">${order.orderNo || order.outTradeNo}</td>
            <td>${order.userEmail || order.userId || '-'}</td>
            <td>${typeText}</td>
            <td>¥${order.totalAmount || order.price}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
            <td style="font-size:12px;color:#86868b;">${time}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderUsers(users) {
      const container = document.getElementById('user-list');
      const userArray = Object.values(users);
      
      if (!userArray.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">👥</div>
            <p>暂无注册用户</p>
          </div>
        `;
        return;
      }
      
      let html = `
        <table class="order-table">
          <thead>
            <tr>
              <th>用户邮箱</th>
              <th>用户ID</th>
              <th>书币余额</th>
              <th>累计充值</th>
              <th>会员状态</th>
              <th>注册时间</th>
            </tr>
          </thead>
          <tbody>
      `;
      
      userArray.forEach(user => {
        const isVip = user.vipExpireTime && new Date(user.vipExpireTime) > new Date();
        const vipStatus = isVip ? `<span class="status-badge status-paid">VIP</span>` : `<span class="status-badge status-expired">普通</span>`;
        const regTime = user.createdAt ? new Date(user.createdAt).toLocaleString() : '-';
        
        html += `
          <tr>
            <td style="font-weight:600;">${user.email}</td>
            <td style="font-family:monospace;font-size:12px;">${user.userId}</td>
            <td>${user.coins || 0}</td>
            <td>¥${user.totalRecharged || 0}</td>
            <td>${vipStatus}</td>
            <td style="font-size:12px;color:#86868b;">${regTime}</td>
          </tr>
        `;
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function updateStats(orders) {
      const pending = orders.filter(o => o.status === 'pending' || o.status === 'pending_review').length;
      const completed = orders.filter(o => o.status === 'paid').length;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-completed').textContent = completed;
    }

    async function approveOrder(orderNo) {
      if (!confirm('确认通过此订单？用户将获得相应权益。')) return;
      
      try {
        const response = await fetch(`/api/alipay/orders/${orderNo}/approve`, {
          method: 'POST'
        });
        const result = await response.json();
        
        if (result.success) {
          showNotification('success', '审核通过', '订单已通过，用户权益已发放');
          loadOrders();
        } else {
          showNotification('error', '操作失败', result.message);
        }
      } catch (error) {
        showNotification('error', '操作失败', '网络错误');
      }
    }

    async function rejectOrder(orderNo) {
      if (!confirm('确认拒绝此订单？')) return;
      
      try {
        const response = await fetch(`/api/alipay/orders/${orderNo}/reject`, {
          method: 'POST'
        });
        const result = await response.json();
        
        if (result.success) {
          showNotification('success', '已拒绝', '订单已被拒绝');
          loadOrders();
        } else {
          showNotification('error', '操作失败', result.message);
        }
      } catch (error) {
        showNotification('error', '操作失败', '网络错误');
      }
    }

    loadOrders();
  </script>
</body>
</html>
