<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付成功</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }

    .success-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 30px;
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .success-icon .check {
      font-size: 50px;
      color: white;
    }

    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .order-info {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .order-info .row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .order-info .row:last-child {
      border-bottom: none;
    }

    .order-info .label {
      color: #999;
      font-size: 0.95rem;
    }

    .order-info .value {
      color: #333;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 15px;
    }

    .btn {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #f8f9ff;
    }

    @media (max-width: 768px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">
      <span class="check">✓</span>
    </div>
    <h1>支付成功！</h1>
    <p>感谢您的支持，您的订单已支付成功。</p>

    <div class="order-info" id="order-info">
      <div class="row">
        <span class="label">订单编号</span>
        <span class="value" id="out-trade-no">-</span>
      </div>
      <div class="row">
        <span class="label">交易号</span>
        <span class="value" id="trade-no">处理中...</span>
      </div>
      <div class="row">
        <span class="label">支付金额</span>
        <span class="value" id="total-amount">-</span>
      </div>
      <div class="row">
        <span class="label">支付时间</span>
        <span class="value" id="pay-time">-</span>
      </div>
    </div>

    <div class="buttons">
      <a href="/" class="btn btn-secondary">继续充值</a>
      <a href="/" class="btn btn-primary">返回阅读</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const outTradeNo = urlParams.get('out_trade_no');
    const tradeNo = urlParams.get('trade_no');
    const totalAmount = urlParams.get('total_amount');

    if (outTradeNo) {
      document.getElementById('out-trade-no').textContent = outTradeNo;
    }

    if (tradeNo) {
      document.getElementById('trade-no').textContent = tradeNo;
    }

    if (totalAmount) {
      document.getElementById('total-amount').textContent = `¥${totalAmount}`;
    }

    document.getElementById('pay-time').textContent = new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
