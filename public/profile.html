<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
        }
        .user-details {
            flex: 1;
        }
        .user-details h3 {
            color: #333;
            margin-bottom: 5px;
        }
        .user-details p {
            color: #999;
            font-size: 0.9rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-item .value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-item .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
        .info-group {
            margin-bottom: 20px;
        }
        .info-group label {
            display: block;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        .info-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="location.href='payment.html'">← 返回首页</button>
            <h1>👤 用户中心</h1>
        </div>

        <div class="card">
            <h2>基本信息</h2>
            <div class="user-info">
                <div class="avatar">👤</div>
                <div class="user-details">
                    <h3 id="user-email">未登录</h3>
                    <p>注册时间：2024年1月1日</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>数据统计</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="value" id="coins">0</div>
                    <div class="label">书币余额</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="total-recharged">0</div>
                    <div class="label">累计充值(元)</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="vip-status">否</div>
                    <div class="label">会员状态</div>
                </div>
                <div class="stat-item">
                    <div class="value" id="lotteries">0</div>
                    <div class="label">抽奖次数</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>账号设置</h2>
            <div class="info-group">
                <label>绑定邮箱</label>
                <input type="email" id="email" disabled>
            </div>
            <div class="info-group">
                <label>更换密码</label>
                <input type="password" id="new-password" placeholder="请输入新密码">
            </div>
            <button class="btn" onclick="saveProfile()">保存设置</button>
        </div>
    </div>

    <script>
        // 获取用户数据
        async function loadUserProfile() {
            const userData = localStorage.getItem('currentUser');
            if (userData) {
                const user = JSON.parse(userData);
                document.getElementById('user-email').textContent = user.email;
                document.getElementById('email').value = user.email;
                
                try {
                    const response = await fetch(`/api/alipay/user/${user.userId}/info`);
                    const result = await response.json();
                    if (result.success) {
                        document.getElementById('coins').textContent = result.data.coins;
                        document.getElementById('total-recharged').textContent = result.data.totalRecharged;
                        document.getElementById('vip-status').textContent = result.data.isVip ? '是' : '否';
                        document.getElementById('lotteries').textContent = result.data.lotteries || 0;
                    }
                } catch (error) {
                    console.error('获取用户信息失败:', error);
                }
            } else {
                alert('请先登录');
                location.href = 'payment.html';
            }
        }
        
        function saveProfile() {
            alert('设置已保存');
        }
        
        loadUserProfile();
    </script>
</body>
</html>
