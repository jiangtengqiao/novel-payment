<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爬虫状态 - 小说平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(180deg, #f8f6f0 0%, #f5f3eb 100%);
      color: #333;
      padding: 40px 20px;
      line-height: 1.8;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 10px;
    }
    .stat-label {
      font-size: 15px;
      color: #666;
    }
    .controls {
      text-align: center;
      margin-bottom: 30px;
    }
    .btn {
      padding: 14px 36px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
    .logs {
      background: white;
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .logs h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #333;
    }
    .log-item {
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .back-link {
      display: inline-block;
      color: #667eea;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="back-link" onclick="window.location.href='/'">← 返回首页</span>
    <h1>🕷️ 爬虫状态</h1>
    
    <div class="controls">
      <button class="btn" onclick="triggerCrawl()">手动触发爬虫</button>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="booksCrawled">-</div>
        <div class="stat-label">爬取书籍数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="chaptersCrawled">-</div>
        <div class="stat-label">爬取章节数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="errors">-</div>
        <div class="stat-label">错误次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="lastCrawlTime">-</div>
        <div class="stat-label">最后爬取</div>
      </div>
    </div>
    
    <div class="logs">
      <h3>📋 说明</h3>
      <div class="log-item">
        <strong>爬虫工作原理：</strong><br>
        1. 每10分钟自动执行一次爬取<br>
        2. 每次爬取会保存到数据库<br>
        3. 已存在的书籍会被跳过，避免重复<br>
        4. 错误会被记录并继续运行
      </div>
      <div class="log-item">
        <strong>为什么会有模拟数据？</strong><br>
        真实的小说网站有反爬机制，为了演示功能，我们使用了模拟数据。<br>
        实际部署时可以接入真实的小说API。
      </div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      try {
        const response = await fetch('/api/crawler/status');
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('booksCrawled').textContent = data.stats.booksCrawled || 0;
          document.getElementById('chaptersCrawled').textContent = data.stats.chaptersCrawled || 0;
          document.getElementById('errors').textContent = data.stats.errors || 0;
          
          if (data.stats.lastCrawlTime) {
            const date = new Date(data.stats.lastCrawlTime);
            document.getElementById('lastCrawlTime').textContent = 
              date.toLocaleTimeString('zh-CN');
          }
        }
      } catch (error) {
        console.error('加载状态失败:', error);
      }
    }
    
    async function triggerCrawl() {
      if (!confirm('确定要手动触发爬虫吗？')) return;
      
      try {
        const response = await fetch('/api/crawler/trigger', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pages: 1 })
        });
        const data = await response.json();
        
        if (data.success) {
          alert('爬虫已触发！请查看页面或控制台日志。');
          loadStatus();
        } else {
          alert('触发失败: ' + data.message);
        }
      } catch (error) {
        console.error('触发失败:', error);
        alert('触发失败，请稍后重试');
      }
    }
    
    loadStatus();
    setInterval(loadStatus, 5000);
  </script>
</body>
</html>
