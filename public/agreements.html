<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协议中心 - 小说平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
            color: #1a1a1a;
            line-height: 1.8;
            min-height: 100vh;
        }

        .header {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 15px;
            color: #495057;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #f8f9fa;
            color: #212529;
        }

        .container {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .agreement-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            color: #495057;
        }

        .agreement-item:hover {
            background: #f8f9fa;
            color: #212529;
        }

        .agreement-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .content {
            background: white;
            border-radius: 12px;
            padding: 40px 48px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .content-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid #f0f0f0;
        }

        .content-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .last-updated {
            font-size: 14px;
            color: #868e96;
        }

        .content-body {
            font-size: 16px;
            line-height: 2;
            color: #212529;
        }

        .section {
            margin-bottom: 32px;
            padding: 24px;
            background: #fafafa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #212529;
        }

        .section-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .section-content p {
            margin-bottom: 16px;
            text-indent: 2em;
        }

        .section-content ul, .section-content ol {
            margin-left: 2em;
            margin-bottom: 16px;
        }

        .section-content li {
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }

            .content {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="logo" style="font-size: 20px; font-weight: 700;">📜 协议中心</div>
            <div style="width: 80px;"></div>
        </div>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-title">协议列表</div>
            <div class="agreement-item active" data-id="userAgreement">📄 用户服务协议</div>
            <div class="agreement-item" data-id="privacyPolicy">🔒 隐私政策</div>
            <div class="agreement-item" data-id="communityGuidelines">📋 社区规范</div>
        </div>

        <div class="content" id="agreementContent">
            <div class="content-header">
                <div class="content-title" id="contentTitle">用户服务协议</div>
                <div class="last-updated" id="lastUpdated">最后更新：2026-05-15</div>
            </div>
            <div class="content-body" id="contentBody">
                <div class="loading">正在加载协议内容...</div>
            </div>
        </div>
    </div>

    <script>
        let agreements = {};

        async function loadAgreements() {
            try {
                const response = await fetch('/data/agreements.json');
                agreements = await response.json();
                renderAgreement('userAgreement');
            } catch (error) {
                console.error('加载协议失败:', error);
                document.getElementById('contentBody').innerHTML = '<p style="color: #dc3545;">协议加载失败，请刷新页面重试。</p>';
            }
        }

        function renderAgreement(id) {
            const agreement = agreements[id];
            if (!agreement) return;

            document.getElementById('contentTitle').textContent = agreement.title;
            document.getElementById('lastUpdated').textContent = '最后更新：' + agreement.lastUpdated;

            let html = '';
            agreement.sections.forEach(section => {
                html += `
                    <div class="section">
                        <div class="section-title">${section.title}</div>
                        <div class="section-content">${section.content}</div>
                    </div>
                `;
            });

            document.getElementById('contentBody').innerHTML = html;

            document.querySelectorAll('.agreement-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.id === id) {
                    item.classList.add('active');
                }
            });
        }

        document.querySelectorAll('.agreement-item').forEach(item => {
            item.addEventListener('click', () => {
                renderAgreement(item.dataset.id);
            });
        });

        function goBack() {
            window.history.back();
        }

        loadAgreements();
    </script>
</body>
</html>
