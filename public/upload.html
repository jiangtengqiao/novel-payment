<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传收款码</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .upload-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon { font-size: 4rem; margin-bottom: 20px; }
    h2 { color: #333; margin-bottom: 15px; font-size: 1.8rem; }
    p { color: #666; margin-bottom: 30px; font-size: 1rem; }
    
    .upload-area {
      border: 3px dashed #ddd;
      border-radius: 15px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 25px;
    }
    .upload-area:hover { border-color: #667eea; background: #f8f9ff; }
    .upload-area.dragover { border-color: #667eea; background: #f0f4ff; }
    .upload-area .upload-icon { font-size: 3rem; margin-bottom: 15px; color: #667eea; }
    .upload-area p { margin-bottom: 5px; }
    .upload-area .hint { font-size: 0.85rem; color: #999; }
    
    #file-input { display: none; }
    
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 20px rgba(102,126,234,0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(102,126,234,0.6); }
    .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .preview {
      margin-top: 25px;
      display: none;
    }
    .preview.show { display: block; }
    .preview img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    .preview p { margin-top: 15px; font-size: 0.9rem; }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    
    .nav-links {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .nav-links a {
      color: #667eea;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .nav-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="upload-card">
    <div class="icon">📷</div>
    <h2>上传支付宝收款码</h2>
    <p>将你的支付宝收款码图片上传到服务器</p>
    
    <div class="upload-area" id="upload-area">
      <div class="upload-icon">📤</div>
      <p>点击或拖拽图片到这里</p>
      <p class="hint">支持 JPG、PNG 格式，最大 5MB</p>
    </div>
    <input type="file" id="file-input" accept="image/jpeg,image/png">
    
    <button class="btn" id="upload-btn" disabled>上传收款码</button>
    
    <div class="preview" id="preview">
      <img id="preview-img" src="" alt="预览">
      <p>预览图</p>
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="nav-links">
      <a href="/">← 返回支付页面</a>
    </div>
  </div>

  <script>
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');
    const uploadBtn = document.getElementById('upload-btn');
    const preview = document.getElementById('preview');
    const previewImg = document.getElementById('preview-img');
    const status = document.getElementById('status');
    let selectedFile = null;

    uploadArea.addEventListener('click', () => fileInput.click());

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      const filetypes = /jpeg|jpg|png/;
      const mimetype = filetypes.test(file.type);
      const extname = filetypes.test(file.name.split('.').pop().toLowerCase());
      
      if (!mimetype || !extname) {
        showStatus('error', '请选择 JPG 或 PNG 格式的图片');
        return;
      }
      
      if (file.size > 5 * 1024 * 1024) {
        showStatus('error', '图片大小不能超过 5MB');
        return;
      }
      
      selectedFile = file;
      uploadBtn.disabled = false;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        preview.classList.add('show');
        showStatus('');
      };
      reader.readAsDataURL(file);
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      
      uploadBtn.disabled = true;
      uploadBtn.textContent = '上传中...';
      
      const formData = new FormData();
      formData.append('qrcode', selectedFile);
      
      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          showStatus('success', result.message);
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } else {
          showStatus('error', result.message);
        }
      } catch (error) {
        showStatus('error', '上传失败，请稍后重试');
      }
      
      uploadBtn.textContent = '上传收款码';
      uploadBtn.disabled = false;
    });

    function showStatus(type, message) {
      status.classList.remove('show', 'success', 'error');
      if (message) {
        status.classList.add('show', type);
        status.textContent = message;
      }
    }
  </script>
</body>
</html>
