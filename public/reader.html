
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读 - 小说书城</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', Georgia, serif;
            background: #f5f1e8;
            color: #2c2c2c;
            line-height: 1.8;
        }

        .header {
            background: #fff;
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #495057;
            padding: 8px;
        }

        .book-title {
            font-size: 18px;
            font-weight: 600;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid #e5e0d5;
        }

        .chapter-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .chapter-content {
            font-size: 18px;
            line-height: 2;
            text-align: justify;
        }

        .chapter-content p {
            margin-bottom: 24px;
            text-indent: 2em;
        }

        .chapter-nav {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid #e5e0d5;
        }

        .nav-btn {
            flex: 1;
            padding: 14px 24px;
            background: #fff;
            border: 2px solid #e5e0d5;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .toolbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 12px 24px;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .tool-btn {
            background: none;
            border: none;
            padding: 12px;
            cursor: pointer;
            color: #495057;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .chapter-content {
                font-size: 16px;
            }
            .content {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <button class="back-btn" onclick="goBack()">← 返回</button>
            <div class="book-title" id="bookTitle">加载中...</div>
            <div style="width: 60px;"></div>
        </div>
    </header>

    <div class="content" id="content">
        <div class="chapter-header">
            <h1 class="chapter-title" id="chapterTitle">加载中...</h1>
        </div>
        <div class="chapter-content" id="chapterContent">
            <p>正在加载章节内容...</p>
        </div>
        <div class="chapter-nav" id="chapterNav">
            <button class="nav-btn" id="prevBtn" onclick="prevChapter()">上一章</button>
            <button class="nav-btn" id="nextBtn" onclick="nextChapter()">下一章</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('bookId');
        let book = null;
        let chapters = [];
        let currentChapterIndex = 0;

        async function loadBook() {
            try {
                const res = await fetch(`/api/books/${bookId}`);
                const data = await res.json();
                book = data.book;
                document.getElementById('bookTitle').textContent = book.title;
                await loadChapters();
            } catch (err) {
                console.error(err);
                alert('加载失败');
            }
        }

        async function loadChapters() {
            try {
                const res = await fetch(`/api/books/${bookId}/chapters`);
                const data = await res.json();
                chapters = data.chapters;
                if (chapters.length > 0) {
                    loadChapter(0);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            currentChapterIndex = index;
            const chapter = chapters[index];
            
            document.getElementById('chapterTitle').textContent = chapter.title;
            
            const contentHtml = chapter.content.split('\n').map(p => 
                p.trim() ? `<p>${p.trim()}</p>` : ''
            ).join('');
            document.getElementById('chapterContent').innerHTML = contentHtml;
            
            updateNavButtons();
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentChapterIndex === 0;
            document.getElementById('nextBtn').disabled = currentChapterIndex === chapters.length - 1;
        }

        function prevChapter() {
            if (currentChapterIndex > 0) {
                loadChapter(currentChapterIndex - 1);
                window.scrollTo(0, 0);
            }
        }

        function nextChapter() {
            if (currentChapterIndex < chapters.length - 1) {
                loadChapter(currentChapterIndex + 1);
                window.scrollTo(0, 0);
            }
        }

        function goBack() {
            window.location.href = '/';
        }

        loadBook();
    </script>
</body>
</html>
