<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读器 - 小说平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', Georgia, serif;
            background: #f8f6f0;
            color: #333;
            line-height: 1.9;
            transition: background 0.3s, color 0.3s;
        }

        /* 顶部导航 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 14px 20px;
            box-shadow: 0 1px 15px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            font-size: 15px;
            cursor: pointer;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            transition: all 0.3s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .book-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }

        .settings-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 50px;
            transition: all 0.3s;
            color: white;
        }
        .settings-btn:hover {
            transform: translateY(-2px) rotate(5deg);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        /* 内容区域 */
        .content {
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 24px 120px;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 45px;
            padding-bottom: 30px;
            position: relative;
        }
        .chapter-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .chapter-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .chapter-content {
            font-size: 18px;
            line-height: 2.1;
            text-align: justify;
            white-space: pre-wrap;
            letter-spacing: 0.5px;
        }

        .chapter-content p {
            margin-bottom: 28px;
            text-indent: 2em;
        }

        /* 上下章 */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 60px;
            padding-top: 40px;
        }

        .nav-btn {
            padding: 14px 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .nav-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.45);
        }
        .nav-btn:disabled {
            background: linear-gradient(135deg, #ccc 0%, #aaa 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: linear-gradient(180deg, #fff 0%, #fafafa 100%);
            box-shadow: -10px 0 40px rgba(0,0,0,0.12);
            z-index: 1000;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 35px 30px;
            overflow-y: auto;
        }
        .settings-panel.active { right: 0; }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }
        .settings-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .close-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .close-btn:hover {
            transform: rotate(90deg);
        }

        .setting-group {
            margin-bottom: 35px;
        }
        .setting-label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
            color: #555;
        }

        .font-size-options {
            display: flex;
            gap: 12px;
        }
        .font-size-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e8e8e8;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
            color: #666;
        }
        .font-size-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%);
            color: #667eea;
            transform: scale(1.05);
        }
        .font-size-btn:hover {
            border-color: #667eea;
        }

        .font-family-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .font-family-btn {
            padding: 18px;
            border: 2px solid #e8e8e8;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .font-family-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8ecff 100%);
        }
        .font-family-btn:hover {
            border-color: #667eea;
        }
        .font-family-btn .font-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .font-family-btn .font-preview {
            font-size: 14px;
            color: #999;
        }

        .theme-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .theme-btn {
            height: 70px;
            border: 3px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .theme-btn.active { 
            border-color: #667eea;
            transform: scale(1.08);
        }
        .theme-btn:hover {
            transform: scale(1.05);
        }
        .theme-default { background: linear-gradient(135deg, #f8f6f0 0%, #f0ebe0 100%); }
        .theme-light { background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%); }
        .theme-dark { background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); }
        .theme-green { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); }
        .theme-yellow { background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%); }
        .theme-pink { background: linear-gradient(135deg, #fce4ec 0%, #f8bbd9 100%); }

        /* 目录 */
        .catalog-panel {
            position: fixed;
            top: 0;
            left: -400px;
            width: 400px;
            height: 100vh;
            background: linear-gradient(180deg, #fff 0%, #fafafa 100%);
            box-shadow: 10px 0 40px rgba(0,0,0,0.12);
            z-index: 1000;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 35px 30px;
            overflow-y: auto;
        }
        .catalog-panel.active { left: 0; }

        .catalog-list {
            list-style: none;
        }
        .catalog-item {
            padding: 16px 18px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .catalog-item:hover { 
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            transform: translateX(5px);
        }
        .catalog-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateX(8px);
        }
        .chapter-name {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
        }
        .chapter-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .chapter-free {
            background: rgba(76, 175, 80, 0.15);
            color: #2e7d32;
        }
        .chapter-paid {
            background: rgba(255, 152, 0, 0.15);
            color: #ef6c00;
        }
        .catalog-item.active .chapter-free {
            background: rgba(255,255,255,0.25);
            color: white;
        }
        .catalog-item.active .chapter-paid {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            display: none;
            backdrop-filter: blur(3px);
        }
        .overlay.active { display: block; }

        /* 底部工具栏 - 超级好看！ */
        .bottom-toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 12px 28px;
            border-radius: 50px;
            box-shadow: 0 8px 35px rgba(0,0,0,0.15),
                        0 2px 10px rgba(0,0,0,0.08);
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.9);
        }
        .tool-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
            padding: 8px 16px;
            border-radius: 16px;
        }
        .tool-btn:hover { 
            color: #667eea; 
            background: rgba(102, 126, 234, 0.08);
            transform: translateY(-3px);
        }
        .tool-btn .icon {
            font-size: 22px;
            transition: transform 0.3s;
        }
        .tool-btn:hover .icon {
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            .settings-panel, .catalog-panel { width: 100%; }
            .bottom-toolbar {
                bottom: 15px;
                padding: 10px 20px;
                gap: 10px;
            }
            .tool-btn {
                padding: 8px 12px;
            }
            .content {
                padding: 30px 20px 110px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="book-title" id="bookTitle">加载中...</div>
        <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    </header>

    <div class="content">
        <div class="chapter-header">
            <div class="chapter-title" id="chapterTitle">加载中...</div>
        </div>
        <div class="chapter-content" id="chapterContent">
            加载中...
        </div>

        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" onclick="prevChapter()">← 上一章</button>
            <button class="nav-btn" id="nextBtn" onclick="nextChapter()">下一章 →</button>
        </div>
    </div>

    <!-- 底部超级好看的工具栏 -->
    <div class="bottom-toolbar">
        <button class="tool-btn" onclick="toggleCatalog()">
            <span class="icon">📋</span>
            <span>目录</span>
        </button>
        <button class="tool-btn" onclick="prevChapter()">
            <span class="icon">⬅️</span>
            <span>上一章</span>
        </button>
        <button class="tool-btn" onclick="nextChapter()">
            <span class="icon">➡️</span>
            <span>下一章</span>
        </button>
        <button class="tool-btn" onclick="toggleSettings()">
            <span class="icon">🎨</span>
            <span>设置</span>
        </button>
    </div>

    <!-- 目录面板 -->
    <div class="overlay" id="overlay" onclick="closeAll()"></div>
    <div class="catalog-panel" id="catalogPanel">
        <div class="settings-header">
            <div class="settings-title">📋 目录</div>
            <button class="close-btn" onclick="toggleCatalog()">×</button>
        </div>
        <ul class="catalog-list" id="catalogList">
            <!-- 动态加载 -->
        </ul>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <div class="settings-title">🎨 阅读设置</div>
            <button class="close-btn" onclick="toggleSettings()">×</button>
        </div>

        <div class="setting-group">
            <label class="setting-label">📐 字体大小</label>
            <div class="font-size-options">
                <button class="font-size-btn" data-size="16">小</button>
                <button class="font-size-btn active" data-size="18">中</button>
                <button class="font-size-btn" data-size="20">大</button>
                <button class="font-size-btn" data-size="24">特大</button>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">✏️ 字体类型</label>
            <div class="font-family-options">
                <button class="font-family-btn active" data-font="'Noto Serif SC', Georgia, serif">
                    <div class="font-name" style="font-family: 'Noto Serif SC', Georgia, serif;">宋体</div>
                    <div class="font-preview" style="font-family: 'Noto Serif SC', Georgia, serif;">经典阅读体验</div>
                </button>
                <button class="font-family-btn" data-font="'Noto Sans SC', -apple-system, sans-serif">
                    <div class="font-name" style="font-family: 'Noto Sans SC', sans-serif;">黑体</div>
                    <div class="font-preview" style="font-family: 'Noto Sans SC', sans-serif;">现代简洁风格</div>
                </button>
                <button class="font-family-btn" data-font="'KaiTi', '楷体', serif">
                    <div class="font-name" style="font-family: 'KaiTi', serif;">楷体</div>
                    <div class="font-preview" style="font-family: 'KaiTi', serif;">传统书法风格</div>
                </button>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">🌈 阅读主题</label>
            <div class="theme-options">
                <button class="theme-btn theme-default active" data-bg="#f8f6f0" data-color="#333"></button>
                <button class="theme-btn theme-light" data-bg="#ffffff" data-color="#333333"></button>
                <button class="theme-btn theme-dark" data-bg="#1a1a1a" data-color="#e0e0e0"></button>
                <button class="theme-btn theme-green" data-bg="#e8f5e9" data-color="#2c2c2c"></button>
                <button class="theme-btn theme-yellow" data-bg="#fff8e1" data-color="#2c2c2c"></button>
                <button class="theme-btn theme-pink" data-bg="#fce4ec" data-color="#2c2c2c"></button>
            </div>
        </div>
    </div>

    <script>
        let currentBook = null;
        let currentChapterIndex = 0;
        let chapters = [];

        // 从URL获取书籍ID
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('bookId');

        // 加载书籍和章节
        async function loadBook() {
            if (!bookId) {
                document.getElementById('chapterContent').textContent = '未找到书籍';
                return;
            }

            try {
                const response = await fetch(`/api/books/${bookId}`);
                const data = await response.json();
                
                if (data.success && data.book) {
                    currentBook = data.book;
                    document.getElementById('bookTitle').textContent = currentBook.title;
                    
                    // 加载章节列表
                    await loadChapters();
                    
                    // 加载第一章
                    if (chapters.length > 0) {
                        loadChapter(0);
                    }
                }
            } catch (error) {
                console.error('加载书籍失败:', error);
            }
        }

        async function loadChapters() {
            try {
                const response = await fetch(`/api/books/${bookId}/chapters`);
                const data = await response.json();
                
                if (data.success && data.chapters) {
                    chapters = data.chapters;
                    renderCatalog();
                }
            } catch (error) {
                console.error('加载章节失败:', error);
            }
        }

        function renderCatalog() {
            const catalogList = document.getElementById('catalogList');
            catalogList.innerHTML = chapters.map((chapter, index) => `
                <li class="catalog-item ${index === currentChapterIndex ? 'active' : ''}" onclick="loadChapter(${index})">
                    <span class="chapter-name">${chapter.title}</span>
                    <span class="chapter-status ${chapter.isFree ? 'chapter-free' : 'chapter-paid'}">
                        ${chapter.isFree ? '免费' : chapter.price + '书币'}
                    </span>
                </li>
            `).join('');
        }

        async function loadChapter(index) {
            if (index < 0 || index >= chapters.length) return;
            
            currentChapterIndex = index;
            const chapter = chapters[index];
            
            document.getElementById('chapterTitle').textContent = chapter.title;
            
            // 获取章节详细内容
            try {
                const response = await fetch(`/api/books/${bookId}/chapters/${chapter.id}`);
                const data = await response.json();
                
                if (data.success && data.chapter) {
                    let content = data.chapter.content || '章节内容加载中...';
                    
                    // 如果不是免费且不是VIP，显示付费提示
                    if (!data.chapter.isFree) {
                        content = `此章节需要付费阅读\n\n价格：${data.chapter.price} 书币\n\n请前往充值页面购买书币后继续阅读。`;
                    }
                    
                    document.getElementById('chapterContent').textContent = content;
                }
            } catch (error) {
                document.getElementById('chapterContent').textContent = '章节内容加载失败';
            }
            
            // 更新目录高亮
            renderCatalog();
            
            // 更新按钮状态
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === chapters.length - 1;
            
            // 滚动到顶部
            window.scrollTo(0, 0);
            
            // 关闭目录
            closeAll();
        }

        function prevChapter() {
            if (currentChapterIndex > 0) {
                loadChapter(currentChapterIndex - 1);
            }
        }

        function nextChapter() {
            if (currentChapterIndex < chapters.length - 1) {
                loadChapter(currentChapterIndex + 1);
            }
        }

        function toggleCatalog() {
            document.getElementById('catalogPanel').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('settingsPanel').classList.remove('active');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('catalogPanel').classList.remove('active');
        }

        function closeAll() {
            document.getElementById('catalogPanel').classList.remove('active');
            document.getElementById('settingsPanel').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        function goBack() {
            window.history.back();
        }

        // 字体大小设置
        document.querySelectorAll('.font-size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.font-size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const size = btn.dataset.size;
                document.getElementById('chapterContent').style.fontSize = size + 'px';
            });
        });

        // 字体类型设置
        document.querySelectorAll('.font-family-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.font-family-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const font = btn.dataset.font;
                document.body.style.fontFamily = font;
            });
        });

        // 主题设置
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const bg = btn.dataset.bg;
                const color = btn.dataset.color;
                document.body.style.background = bg;
                document.body.style.color = color;
            });
        });

        // 加载书籍
        loadBook();
    </script>
</body>
</html>
