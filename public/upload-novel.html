<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上传小说 - 小说平台</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(180deg, #f8f6f0 0%, #f5f3eb 100%);
      color: #333;
      padding: 40px 20px;
      min-height: 100vh;
      line-height: 1.8;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #667eea;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 30px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .back-link:hover {
      text-decoration: underline;
    }
    
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #333;
    }
    
    .subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 35px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }
    
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s;
    }
    
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
    }
    
    .file-upload {
      border: 2px dashed #e0e0e0;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #f8f9fa;
    }
    
    .file-upload:hover {
      border-color: #667eea;
      background: #f0f4ff;
    }
    
    .file-upload.dragover {
      border-color: #667eea;
      background: #eaf0ff;
    }
    
    .file-upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    
    .file-upload-text {
      font-size: 15px;
      color: #666;
      margin-bottom: 5px;
    }
    
    .file-upload-hint {
      font-size: 13px;
      color: #999;
    }
    
    .selected-file {
      margin-top: 15px;
      padding: 12px;
      background: #f0f4ff;
      border-radius: 10px;
      font-size: 14px;
      color: #667eea;
      display: none;
    }
    
    .selected-file.show {
      display: block;
    }
    
    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102,126,234,0.3);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102,126,234,0.4);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .tips {
      margin-top: 30px;
      padding: 20px;
      background: #fff8e6;
      border-radius: 12px;
      border-left: 4px solid #ffa500;
    }
    
    .tips-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffa500;
      margin-bottom: 10px;
    }
    
    .tips-list {
      font-size: 14px;
      color: #666;
      list-style: none;
    }
    
    .tips-list li {
      padding: 6px 0;
    }
    
    .tips-list li::before {
      content: '• ';
      color: #ffa500;
      font-weight: bold;
    }
    
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      display: none;
    }
    
    .status.show {
      display: block;
    }
    
    .status.success {
      background: #f0fff4;
      border: 1px solid #34d399;
      color: #166534;
    }
    
    .status.error {
      background: #fff0f0;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" onclick="window.location.href='/'">
      ← 返回首页
    </a>
    
    <div class="card">
      <h1>上传小说</h1>
      <p class="subtitle">支持 TXT 格式，自动解析章节</p>
      
      <form id="uploadForm">
        <div class="form-group">
          <label>书名</label>
          <input type="text" name="title" placeholder="请输入书名" required>
        </div>
        
        <div class="form-group">
          <label>作者</label>
          <input type="text" name="author" placeholder="请输入作者" required>
        </div>
        
        <div class="form-group">
          <label>TXT 文件</label>
          <div class="file-upload" id="fileUpload">
            <div class="file-upload-icon">📚</div>
            <div class="file-upload-text">点击或拖拽文件到这里</div>
            <div class="file-upload-hint">支持 .txt 格式，最大 50MB</div>
            <input type="file" name="file" id="fileInput" accept=".txt" required style="display: none;">
          </div>
          <div class="selected-file" id="selectedFile"></div>
        </div>
        
        <button type="submit" class="btn" id="submitBtn">上传小说</button>
      </form>
      
      <div class="status" id="status"></div>
      
      <div class="tips">
        <div class="tips-title">📝 上传说明</div>
        <ul class="tips-list">
          <li>章节标题格式：第X章 章节名（支持一到十的中文数字）</li>
          <li>前10章免费，后面的章节需要购买</li>
          <li>上传后即可在阅读器中阅读</li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    const fileUpload = document.getElementById('fileUpload');
    const fileInput = document.getElementById('fileInput');
    const selectedFile = document.getElementById('selectedFile');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    
    // 点击上传区域
    fileUpload.addEventListener('click', () => fileInput.click());
    
    // 拖拽上传
    fileUpload.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileUpload.classList.add('dragover');
    });
    
    fileUpload.addEventListener('dragleave', () => {
      fileUpload.classList.remove('dragover');
    });
    
    fileUpload.addEventListener('drop', (e) => {
      e.preventDefault();
      fileUpload.classList.remove('dragover');
      
      const files = e.dataTransfer.files;
      if (files.length > 0 && files[0].name.endsWith('.txt')) {
        fileInput.files = files;
        showSelectedFile(files[0]);
      } else {
        alert('请上传 TXT 文件！');
      }
    });
    
    // 选择文件
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        showSelectedFile(fileInput.files[0]);
      }
    });
    
    function showSelectedFile(file) {
      const fileSize = (file.size / 1024 / 1024).toFixed(2);
      selectedFile.textContent = `已选择: ${file.name} (${fileSize} MB)`;
      selectedFile.classList.add('show');
    }
    
    // 提交表单
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!fileInput.files.length) {
        alert('请选择文件！');
        return;
      }
      
      const formData = new FormData(uploadForm);
      submitBtn.disabled = true;
      submitBtn.textContent = '上传中...';
      
      status.className = 'status';
      status.classList.remove('show');
      
      try {
        const response = await fetch('/api/books/upload', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          status.className = 'status success show';
          status.innerHTML = `✅ 上传成功！共 ${result.chapters} 章<br><br><a href="/reader?bookId=${result.bookId}" style="color: #667eea; font-weight: 600;">立即阅读 →</a>`;
          uploadForm.reset();
          selectedFile.classList.remove('show');
        } else {
          status.className = 'status error show';
          status.textContent = '❌ 上传失败：' + result.message;
        }
      } catch (error) {
        status.className = 'status error show';
        status.textContent = '❌ 上传失败：' + error.message;
      }
      
      submitBtn.disabled = false;
      submitBtn.textContent = '上传小说';
    });
  </script>
</body>
</html>
